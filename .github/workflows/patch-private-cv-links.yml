name: Normalize private CV links

on:
  push:
    branches:
      - agent/public-product-case-study
    paths:
      - .github/workflows/patch-private-cv-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Replace public-looking private repository links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          markdown = Path('CV.md')
          text = markdown.read_text(encoding='utf-8')
          old = '[Aegis](https://github.com/gonzo-max2/aegis-unified-0.9.0) · [NOVA](https://github.com/gonzo-max2/NOVA)'
          new = '[Aegis](https://github.com/gonzo-max2/aegis-unified-0.9.0) · NOVA (private evaluation repository)'
          if old not in text:
              raise SystemExit('Expected CV.md private-link sequence not found')
          markdown.write_text(text.replace(old, new, 1), encoding='utf-8')

          html = Path('cv.html')
          page = html.read_text(encoding='utf-8')
          old_html = '<a href="https://github.com/gonzo-max2/NOVA">NOVA</a>'
          new_html = '<span>NOVA · private evaluation</span>'
          if old_html not in page:
              raise SystemExit('Expected cv.html private link not found')
          html.write_text(page.replace(old_html, new_html, 1), encoding='utf-8')
          PY

      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV.md cv.html
          git commit -m "Clarify private NOVA repository in public CV"
          git push origin "HEAD:${GITHUB_REF_NAME}"
